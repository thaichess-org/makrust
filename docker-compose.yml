services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makrust
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  # only used to run migrations, it's destroyed right after.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: makrust:dev
    # Dockerfile sets ENTRYPOINT ["./makrust"]; `entrypoint:` (not `command:`)
    # is required here to actually replace it with the migrate binary.
    entrypoint: ["./migrate"]
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE__HOST: db
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: makrust:dev
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE__HOST: db
      EMAIL_SERVER_TOKEN: ${EMAIL_SERVER_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
        
volumes:
  db_data:
