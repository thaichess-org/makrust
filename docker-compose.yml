services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makrust
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: makrust:dev
    # Dockerfile sets ENTRYPOINT ["./makrust"]; `entrypoint:` (not `command:`)
    # is required here to actually replace it with the migrate binary.
    entrypoint: ["./migrate"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/makrust
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: makrust:dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/makrust
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
